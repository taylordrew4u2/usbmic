name: Release

# Produces downloadable builds for all three platforms. Runs on a version tag,
# and on demand so a build can be had without cutting a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Optional: publish a GitHub Release under this tag (e.g. v0.1.0).
          The tag is created at the built commit by the workflow itself --
          this environment's git proxy only permits branch pushes, so tagging
          has to happen here. Leave empty for build-only artifacts.
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 for the same reason as CI: JUCE 7.0.12 calls
          # CGWindowListCreateImage, which the macOS 15+ SDK marks unavailable.
          - os: macos-14
            label: macOS
            artifact: MultiMicAggregator-macOS
          - os: windows-latest
            label: Windows
            artifact: MultiMicAggregator-Windows
          - os: ubuntu-latest
            label: Linux
            artifact: MultiMicAggregator-Linux

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxcursor-dev libxcomposite-dev \
            libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-7.0.12-${{ runner.os }}

      - name: Configure
        run: cmake -B build -DMMA_BUILD_APP=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      # The unit tests gate the release: a build that cannot pass them is not
      # worth handing to anyone.
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      # The install tree IS the deliverable, so packaging exercises the same
      # install() rules a local `cmake --install` uses rather than a second,
      # parallel copy step that could drift away from them.
      - name: Install
        run: cmake --install build --prefix out --config Release

      - name: Check the artifact is not empty
        shell: bash
        run: |
          ls -R out
          test -n "$(find out -type f)"

      # macOS only, and the step that makes this downloadable rather than merely
      # built: a .dmg is how macOS expects to hand someone an app. hdiutil ships
      # only on macOS, so this cannot be deferred to the Linux release job.
      #
      # The image is NOT signed or notarized -- that needs an Apple Developer ID,
      # which is an account and a certificate rather than anything the source can
      # produce. Gatekeeper will therefore refuse the first launch until the user
      # right-clicks -> Open; the README says so in the same words.
      - name: Package the macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          staging="${RUNNER_TEMP}/dmg/Multi-Mic Aggregator"
          rm -rf "${RUNNER_TEMP}/dmg"
          mkdir -p "$staging"

          cp -R out/*.app "$staging/"
          cp out/README.md out/LICENSE out/LICENSING.md "$staging/"

          # Drag-to-install: the mounted window shows the app next to an
          # Applications alias, which is the gesture Mac users already know.
          ln -s /Applications "$staging/Applications"

          hdiutil create \
            -volname "Multi-Mic Aggregator" \
            -srcfolder "$staging" \
            -ov -format UDZO \
            "MultiMicAggregator-macOS.dmg"

          # A truncated or corrupt image fails to mount with a message that tells
          # the user nothing, so prove it mounts here instead of on their desk.
          hdiutil verify "MultiMicAggregator-macOS.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/
          if-no-files-found: error

      - name: Upload the disk image
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: MultiMicAggregator-macOS-dmg
          path: MultiMicAggregator-macOS.dmg
          if-no-files-found: error

  release:
    name: Attach to release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      - name: Archive each platform
        run: |
          cd artifacts
          for d in */; do
            name="${d%/}"

            # A .dmg is already a distributable container. Zipping it would only
            # make people unpack something before they can mount it.
            if compgen -G "$d"/*.dmg > /dev/null; then
              cp "$d"/*.dmg ../
              continue
            fi

            zip -r "../$name.zip" "$d"
          done

      # On a tag push, tag_name is empty and the action uses the ref. On a
      # dispatch with release_tag set, the action creates that tag at the
      # commit this workflow built and tested.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            *.zip
            *.dmg
          generate_release_notes: true
