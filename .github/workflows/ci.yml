name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # Source/Core has no JUCE dependency and no audio hardware requirement,
      # so it builds and its tests run on every target OS without a fetch.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  app:
    name: App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 rather than macos-latest: JUCE 7.0.12 calls
        # CGWindowListCreateImage, which the macOS 15+ SDK marks unavailable, so
        # JUCE's own juceaide fails to build there. macOS 14's SDK still has it,
        # and §1 puts the deployment floor at macOS 13. Moving to a newer SDK
        # means moving to JUCE 8.
        os: [ubuntu-latest, macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # CoreAudioBackend and WasapiAsioBackend sit behind JUCE_MAC / JUCE_WINDOWS
      # guards, so only the matching runner compiles them at all. Without this job
      # they are never built anywhere.
      - name: Install Linux JUCE dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxcursor-dev libxcomposite-dev \
            libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build-app/_deps
          key: juce-7.0.12-${{ runner.os }}

      - name: Configure
        run: cmake -B build-app -DMMA_BUILD_APP=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-app --config Release -j 4
