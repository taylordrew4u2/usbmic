name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Source/Core has no JUCE dependency and no audio hardware requirement,
      # so it builds and its tests run on every target OS without a fetch.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      # Linux only, and the reason this job matters beyond unit tests: it runs
      # the REAL platform backend against ALSA devices the OS enumerates and
      # opens. Nothing else in CI exercises an actual OS audio API.
      - name: Live capture through a real audio API
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev alsa-utils
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DMMA_ALLOW_TEST_INPUTS=ON
          cmake --build build --config Release -j 4
          ./Tools/setup_alsa_fixture.sh
          ./build/live_capture "${RUNNER_TEMP}/live"

      # Threads and raw buffers, so the same runs again under sanitizers: a
      # data race or an overrun in the backends is the class of bug that
      # reaches a user as an intermittent crash rather than a failed check.
      - name: Simulated backends under sanitizers
        if: runner.os == 'Linux'
        run: |
          # -fno-sanitize-recover so a UBSan diagnostic aborts the run:
          # without it the sanitizer prints the error and the binary still
          # exits 0, which is how undefined behaviour rides through a green CI.
          cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          cmake --build build-asan --target sim_coreaudio sim_wasapi -j 4
          ./build-asan/sim_coreaudio
          ./build-asan/sim_wasapi

          cmake -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=thread"
          cmake --build build-tsan --target sim_wasapi -j 4
          ./build-tsan/sim_wasapi

  app:
    name: App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 rather than macos-latest: JUCE 7.0.12 calls
        # CGWindowListCreateImage, which the macOS 15+ SDK marks unavailable, so
        # JUCE's own juceaide fails to build there. macOS 14's SDK still has it,
        # and §1 puts the deployment floor at macOS 13. Moving to a newer SDK
        # means moving to JUCE 8.
        os: [ubuntu-latest, macos-14, windows-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # CoreAudioBackend and WasapiAsioBackend sit behind JUCE_MAC / JUCE_WINDOWS
      # guards, so only the matching runner compiles them at all. Without this job
      # they are never built anywhere.
      - name: Install Linux JUCE dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxcursor-dev libxcomposite-dev \
            libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Cache JUCE
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build-app/_deps
          key: juce-4f43011b96eb0636104cb3e433894cda98243626-${{ runner.os }}-${{ runner.arch }}

      - name: Configure
        run: cmake -B build-app -DMMA_BUILD_APP=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-app --config Release -j 4
